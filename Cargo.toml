[package]
name = "klassikot8000"
version = "0.3.2"
edition = "2024"

[dependencies]
minifb = { version = "0.29.0", default-features = false }
tinyaudio = "2.0.0"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# Paketin koko on tärkein tavoite.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
