[package]
name = "klassikot8000"
version = "0.3.5"
edition = "2024"

[dependencies]
minifb = { version = "0.29.0", default-features = false }
tinyaudio = "2.0.0"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# Linuxissa ikkuna tarvitsee X11:n, joka toimii myös Waylandissa XWaylandin kautta. OpenSSL
# käännetään mukaan, koska sen versio vaihtelee jakeluittain.
[target.'cfg(target_os = "linux")'.dependencies]
minifb = { version = "0.29.0", default-features = false, features = ["x11"] }
native-tls = { version = "0.2", features = ["vendored"] }

# Piirto on ohjelman raskain työ: nopeusoptimointi kasvattaa exeä noin 400 kt, mutta pitää
# paketin selvästi alle 10 Mt:n rajan.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
